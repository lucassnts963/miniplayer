<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="50%" stop-color="#121418"/>
      <stop offset="100%" stop-color="#0a0b0d"/>
    </linearGradient>

    <!-- Main Screen Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2d36"/>
      <stop offset="100%" stop-color="#14161b"/>
    </linearGradient>

    <!-- Red YouTube Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b53"/>
      <stop offset="100%" stop-color="#e60026"/>
    </linearGradient>

    <!-- Glow & Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="redGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#ff0033" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Base Icon Squircle (App Frame) -->
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bgGrad)" stroke="#3a3f4d" stroke-width="8" filter="url(#dropShadow)"/>

  <!-- Subtle Desktop Display Outline -->
  <rect x="140" y="150" width="744" height="460" rx="40" fill="url(#screenGrad)" stroke="#2f3440" stroke-width="6"/>

  <!-- Display Stand / Base lines -->
  <path d="M 440 610 L 410 720 L 614 720 L 584 610 Z" fill="#1b1d24" stroke="#2a2e38" stroke-width="4"/>
  <rect x="360" y="720" width="304" height="24" rx="12" fill="#242731"/>

  <!-- Floating PiP Mini Player Window (Pop-out in foreground) -->
  <g filter="url(#redGlow)">
    <!-- PiP Window Container -->
    <rect x="380" y="380" width="530" height="340" rx="48" fill="#111317" stroke="#ff2a44" stroke-width="12"/>

    <!-- YouTube Screen inside PiP Window -->
    <rect x="404" y="404" width="482" height="292" rx="36" fill="url(#redGrad)"/>

    <!-- YouTube Play Icon in Center of PiP Screen -->
    <polygon points="615,510 615,590 690,550" fill="#ffffff"/>

    <!-- PiP Sub-icon indicator in top-right of main screen -->
    <rect x="730" y="190" width="110" height="76" rx="14" fill="#ff2a44" opacity="0.85"/>
    <rect x="785" y="225" width="44" height="32" rx="6" fill="#ffffff"/>
  </g>
</svg>
